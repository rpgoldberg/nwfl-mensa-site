version: 2

# Weekly update PRs against develop, minor and patch grouped into one PR per ecosystem.
# The three packages (apps/api, apps/linkcheck, apps/web) each have their own lockfile.
updates:
  - package-ecosystem: "npm"
    directories:
      - "/apps/api"
      - "/apps/linkcheck"
      - "/apps/web"
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # PDFJS-6.5: pdf.js is the redaction gate's reader, so a new minor or major is its own unit with a red-team.
      # Patch releases and security updates still come through.
      - dependency-name: "pdfjs-dist"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # TypeScript 7 is its own later unit.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # The runtime is Node 24; the types follow it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: "docker"
    directories:
      - "/apps/api"
      - "/apps/linkcheck"
      - "/apps/web"
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # The tests' Postgres stays on production's major, 17.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
