name: linkcheck

# The off-cluster link checker (apps/linkcheck). Its image runs only on the officer's own machine,
# never in a cluster. The secret scan and the made-up people guard run for the whole repository, in
# secrets.yml.
on:
  push:
    branches: ['**']
    paths: ['apps/linkcheck/**', '.github/workflows/linkcheck.yml']
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['apps/linkcheck/**', '.github/workflows/linkcheck.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/linkcheck

jobs:
  test:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: apps/linkcheck/.nvmrc
          cache: npm
          cache-dependency-path: apps/linkcheck/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage, in a capped container with no network
        # scripts/test-contained.sh: the suite parses PDFs and drives hostile inputs, so it runs under
        # --memory=2g --pids-limit=512 --cpus=2 --network none on the Dockerfile's pinned node image;
        # with no network no test can reach an outside site. The 85 % line AND branch gate, per file,
        # lives in vitest.config.ts.
        env:
          CI: 'true'
        run: npm run test:coverage

      - name: Build
        run: npm run build

  image:
    name: Build and run the image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: apps/linkcheck/.nvmrc

      - name: Make the checkout look like a umask 077 one
        # The image must set its own modes and still run.
        run: chmod -R go-rwx .

      - name: Build the image
        run: docker build --build-arg SERVICE_VERSION="$(node -pe "require('./package.json').version")" --build-arg REVISION="$GITHUB_SHA" -t nwfl-mensa-linkcheck:ci .

      - name: The image names its commit and this repository
        # apps/api/scripts/image-labels.ts: the revision and source labels, read back from the image.
        run: node ../api/scripts/image-labels.ts local nwfl-mensa-linkcheck:ci "$GITHUB_SHA"

      - name: Extract, check and list run from it with no network
        # scripts/smoke-image.sh: every container --network none, read-only, no capabilities; the
        # check sees only no-fetch links, so a correct run makes no request; uid 65534 by default.
        run: sh scripts/smoke-image.sh nwfl-mensa-linkcheck:ci

  publish:
    name: Publish the image (main only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The only job that may write packages; it never runs on a pull request.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Short commit and version
        id: sha
        run: |
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "version=$(node -pe "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: apps/linkcheck
          build-args: |
            SERVICE_VERSION=${{ steps.sha.outputs.version }}
            REVISION=${{ github.sha }}
          push: true
          tags: ghcr.io/rpgoldberg/nwfl-mensa-site/linkcheck:${{ steps.sha.outputs.short }}

      # The officer's machine runs it by this digest, never by the tag.
      - name: The pushed digest
        run: echo "ghcr.io/rpgoldberg/nwfl-mensa-site/linkcheck@${{ steps.image.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: The pushed image names its commit and this repository
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: node ../api/scripts/image-labels.ts registry "ghcr.io/rpgoldberg/nwfl-mensa-site/linkcheck@$DIGEST" "$GITHUB_SHA"
