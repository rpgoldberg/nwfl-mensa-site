name: web

# The web gateway (apps/web). The secret scan, MT-06 and the made-up people
# guard run once for the whole repository, in secrets.yml. A change to the
# API protos runs it too: the site's gRPC client is generated from them. So
# does a change to the API's code, migrations or scripts: the redaction leak
# test runs the real API.
on:
  push:
    branches: [main, develop]
    paths: ['apps/web/**', 'apps/api/proto/**', 'apps/api/src/**', 'apps/api/migrations/**', 'apps/api/scripts/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['apps/web/**', 'apps/api/proto/**', 'apps/api/src/**', 'apps/api/migrations/**', 'apps/api/scripts/**', '.github/workflows/web.yml']

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/web

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck

  unit:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --ignore-scripts
      # vitest.config.ts holds the 85 % line and branch gate.
      - run: npm run test:coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: web-coverage
          path: apps/web/coverage/
          retention-days: 7

  e2e:
    name: E2E (Chromium, WebKit iPhone, axe), then the public-only canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --ignore-scripts
      # One browser install for both suites.
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: npm run e2e
      # The redaction leak test (REDACT R2b): this full build in front of the
      # real API over a throwaway Postgres seeded with canaries.
      - run: npm ci --ignore-scripts && npm run build
        working-directory: apps/api
      - run: sh ../api/scripts/test-db.sh start >> "$GITHUB_ENV"
      - run: npm run e2e:redaction
      - if: always() && env.NWFL_TEST_PG_CONTAINER != ''
        run: sh ../api/scripts/test-db.sh stop "$NWFL_TEST_PG_CONTAINER"
      # The canary: the same site built with sign-in off.
      - run: npm run build:public-only
      - run: npm run e2e:public-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: failure()
        with:
          name: web-playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  docker:
    name: Image build and read-only start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: apps/web
          push: false
          load: true
          tags: nwfl-mensa-web:ci
      - name: Start with a read-only root and only /tmp writable
        run: |
          docker run -d --name web --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:8080:8080 nwfl-mensa-web:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then break; fi
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:8080/about
          test "$(docker inspect web --format '{{.Config.User}}')" = "10001:10001"
          docker stop web
          test "$(docker inspect web --format '{{.State.ExitCode}}')" = "0"
      - name: The public-only canary image answers its sign-in routes with 404
        run: |
          docker build --build-arg PUBLIC_ONLY=true -t nwfl-mensa-web:canary .
          docker run -d --name canary --read-only --tmpfs /tmp -p 127.0.0.1:8081:8080 nwfl-mensa-web:canary
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8081/healthz; then break; fi
            sleep 1
          done
          for path in /sign-in /auth/callback /officer-area/new; do
            test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8081$path")" = "404"
          done
          docker stop canary

  publish:
    name: Publish the image (main only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, typecheck, unit, e2e, docker]
    runs-on: ubuntu-latest
    # The only job that may write packages; it never runs on a pull request.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: apps/web
          push: true
          tags: ghcr.io/rpgoldberg/nwfl-mensa-site/web:${{ steps.sha.outputs.short }}
      # Deploy by this digest, never by the tag.
      - name: The pushed digest
        run: echo "ghcr.io/rpgoldberg/nwfl-mensa-site/web@${{ steps.image.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
