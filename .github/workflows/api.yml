name: api

# The API (apps/api). The secret scan, MT-06 and the made-up people guard run
# once for the whole repository, in secrets.yml.
on:
  push:
    branches: ['**']
    paths: ['apps/api/**', '.github/workflows/api.yml']
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['apps/api/**', '.github/workflows/api.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/api

jobs:
  test:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # .nvmrc pins the same Node 24 LTS release the Dockerfile runs.
          node-version-file: apps/api/.nvmrc
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        # fc-shared is vendored (vendor/README.md), so no registry token.
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Start a throwaway Postgres
        # Writes NWFL_TEST_PG_CONTAINER and NWFL_TEST_DATABASE_URL for the
        # live suites; with CI=true a missing database fails them.
        run: sh scripts/test-db.sh start >> "$GITHUB_ENV"

      - name: Test with coverage
        # The 85 % line AND branch gate, per file, lives in vitest.config.ts,
        # so it fails here and locally on the same thresholds.
        run: npm run test:coverage

      - name: Remove the throwaway Postgres
        if: always() && env.NWFL_TEST_PG_CONTAINER != ''
        run: sh scripts/test-db.sh stop "$NWFL_TEST_PG_CONTAINER"

      - name: Build
        run: npm run build

  proto:
    name: Proto lint, breaking, codegen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # buf breaking reads the base commit from the local history.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: apps/api/.nvmrc
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: buf lint
        run: npm run proto:lint

      - name: buf breaking
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: sh scripts/buf-breaking.sh "$BASE"

      - name: Generated code matches the protos
        run: |
          npm run proto:generate
          git add -N src/gen
          git diff --exit-code -- src/gen

  image:
    name: Build and run the image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Make the checkout look like a umask 077 one
        # Files 0600 and directories 0700, as a checkout made under umask 077
        # leaves them. The image must set its own modes and still run.
        run: chmod -R go-rwx .

      - name: Build the production image
        run: docker build --build-arg SERVICE_VERSION="$(node -pe "require('./package.json').version")" -t nwfl-mensa-api:ci .

      - name: The image runs as a numeric non-root user
        run: |
          user=$(docker inspect nwfl-mensa-api:ci --format '{{.Config.User}}')
          echo "image user: ${user}"
          case "$user" in
            ''|root|0|0:*) echo "::error::the image runs as root"; exit 1 ;;
          esac

      - name: It serves on a read-only root filesystem and drains on SIGTERM
        run: |
          id=$(docker run -d --read-only --cap-drop ALL --security-opt no-new-privileges \
            -p 127.0.0.1::8081 nwfl-mensa-api:ci)
          trap 'docker rm -f "$id" >/dev/null' EXIT
          port=$(docker port "$id" 8081/tcp | head -1 | sed 's/.*://')
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${port}/healthz"; then break; fi
            sleep 1
          done
          curl -fsS "http://127.0.0.1:${port}/healthz"
          docker stop --time 30 "$id" >/dev/null
          code=$(docker inspect "$id" --format '{{.State.ExitCode}}')
          docker logs "$id" | tail -5
          [ "$code" = "0" ] || { echo "::error::exit code ${code} after SIGTERM"; exit 1; }

  publish:
    name: Publish the image (main only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, proto, image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The only job that may write packages; it never runs on a pull request.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Short commit and version
        id: sha
        run: |
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "version=$(node -pe "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: apps/api
          build-args: SERVICE_VERSION=${{ steps.sha.outputs.version }}
          push: true
          tags: ghcr.io/rpgoldberg/nwfl-mensa-site/api:${{ steps.sha.outputs.short }}

      # Deploy by this digest, never by the tag.
      - name: The pushed digest
        run: echo "ghcr.io/rpgoldberg/nwfl-mensa-site/api@${{ steps.image.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
