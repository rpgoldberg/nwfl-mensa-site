name: secrets

# Checks for the whole repository, once, from its root, on every change to it:
# no secret in any commit, no private registry or its token (MT-06), and made-up
# people only in anything tracked.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Secrets, registry and made-up people
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # Every commit, not only the tip: the whole history is public.
          fetch-depth: 0
      # The pinned version and image digest live in scripts/gitleaks.sh, shared
      # with the root's pre-commit hook.
      - name: gitleaks over every commit
        run: sh scripts/gitleaks.sh git --log-opts=--all
      - name: No private registry or its token variable (MT-06)
        run: sh scripts/no-fc-credentials.sh
      - name: Made-up people only
        run: node scripts/made-up-people.mjs
