// The membership verifier's own service (R33). The membership verifier is an
// external membership verification service, called through the
// MembershipVerifierService contract. The API refuses its token on every other
// service, and every other token on this one.
syntax = "proto3";

package nwfl.mensa.v1;

import "google/protobuf/timestamp.proto";

service MembershipVerifierService {
  // The sign-ups that typed a number and have not been checked yet, with the
  // email stored on each (VET). This is the only RPC of this service that
  // returns a membership number.
  rpc ListPendingVerifications(ListPendingVerificationsRequest) returns (ListPendingVerificationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Records the outcome and the date; the sign-up then leaves the pending
  // list. A local match does not approve the sign-up: an
  // officer still does.
  //
  // VET fix 1: a report refused with FAILED_PRECONDITION or NOT_FOUND records
  // nothing here. The verifier must then not keep a claim for it: a sign-up
  // rejected before its report is released before the verifier could see that
  // release, so ListReleasedClaims would never free that claim.
  //
  // Idempotent: when the verifier cannot tell whether a report landed, it
  // sends the same one again (the same outcome and conflicting_request_id).
  // The answer says what to do with the claim:
  //   OK                   An earlier report landed. Keep the claim. Any
  //                        reject, reopening, removal or deletion since that
  //                        report appears in ListReleasedClaims, possibly
  //                        already: apply every release after the cursor held
  //                        when the report was first sent.
  //   FAILED_PRECONDITION  No earlier report landed and the sign-up is
  //                        decided, or a different outcome (or
  //                        conflicting_request_id) was recorded. Drop the
  //                        claim.
  //   NOT_FOUND            No earlier report landed and the sign-up is
  //                        deleted, or it never existed. Drop the claim. A
  //                        sign-up deleted after its report answers NOT_FOUND
  //                        too, and its deletion appears in ListReleasedClaims
  //                        as DELETED.
  // An approval never releases a claim.
  rpc ReportVerification(ReportVerificationRequest) returns (ReportVerificationResponse);
  // VET: the sign-ups whose claim on a number is released, oldest first, after
  // a cursor: rejected, reopened, or whose member account was removed or
  // deleted. The verifier frees those entries in its own ledger. Sign-up ids,
  // times and kinds only: never a number, a name or an email.
  //
  // VET fix 1: it frees only what was reported. A ReportVerification refused
  // with FAILED_PRECONDITION or NOT_FOUND has no release to come here: the
  // verifier must not write a ledger entry for it, or must drop it.
  rpc ListReleasedClaims(ListReleasedClaimsRequest) returns (ListReleasedClaimsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message ListPendingVerificationsRequest {
  // At most 10, the default: oldest first, and a reported sign-up leaves the
  // list, so the next call returns the next ones.
  int32 page_size = 1;
}

message ListPendingVerificationsResponse {
  repeated PendingVerification pending = 1;
}

message PendingVerification {
  string request_id = 1;
  string membership_number = 2;
  string last_name = 3;
  // VET: the email stored on the sign-up, taken from the verified token, for
  // the verifier to confirm (EMAIL_MISMATCH when it does not).
  string email = 4;
}

enum VerificationOutcome {
  VERIFICATION_OUTCOME_UNSPECIFIED = 0;
  // An active member of Northwest Florida Mensa.
  VERIFICATION_OUTCOME_VERIFIED_LOCAL = 1;
  // An active AML member in another local group.
  VERIFICATION_OUTCOME_VERIFIED_OTHER_GROUP = 2;
  VERIFICATION_OUTCOME_NOT_FOUND = 3;
  VERIFICATION_OUTCOME_ERROR = 4;
  // VET: the number and the last name match a local member; the email does
  // not. Neither approves nor rejects: an officer confirms with the member
  // first.
  VERIFICATION_OUTCOME_EMAIL_MISMATCH = 5;
  // VET: the verifier's own ledger says another sign-up already claimed this
  // number. Neither approves nor rejects: an officer resolves it.
  VERIFICATION_OUTCOME_DUPLICATE_CLAIM = 6;
}

message ReportVerificationRequest {
  string request_id = 1;
  VerificationOutcome outcome = 2;
  // VET: with DUPLICATE_CLAIM only, and optional there: the earlier sign-up
  // that holds the claim, by its request id. Empty for none. It must name an
  // existing sign-up other than this one; any other outcome with it is refused.
  string conflicting_request_id = 3;
}

message ReportVerificationResponse {}

message ListReleasedClaimsRequest {
  // The next_cursor of the previous page; empty for the first page.
  string after = 1;
  // At most 100, the default.
  int32 page_size = 2;
}

message ListReleasedClaimsResponse {
  repeated ReleasedClaim released = 1;
  // Pass as `after` for the next page. The same as `after` when nothing new
  // was released. A cursor once seen never goes back: releases are recorded
  // append-only, in commit order.
  string next_cursor = 2;
}

// Why a sign-up's claim on a number was released.
enum ClaimReleaseKind {
  CLAIM_RELEASE_KIND_UNSPECIFIED = 0;
  CLAIM_RELEASE_KIND_REJECTED = 1;
  CLAIM_RELEASE_KIND_REOPENED = 2;
  // The sign-up's member account was removed or deleted.
  CLAIM_RELEASE_KIND_ACCOUNT_DELETED = 3;
  // VET fix 1: the sign-up itself was deleted after it was reported (only the
  // database owner can delete one, and only while pending). An unreported
  // sign-up's deletion is not listed: the verifier never ledgered it.
  CLAIM_RELEASE_KIND_DELETED = 4;
}

message ReleasedClaim {
  string request_id = 1;
  google.protobuf.Timestamp released_at = 2;
  ClaimReleaseKind kind = 3;
}
