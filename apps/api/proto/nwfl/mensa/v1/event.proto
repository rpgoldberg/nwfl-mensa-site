// The calendar: venues, recurring series and dated occurrences (R3). Events are
// live on save, outside the approval queue (P19).
syntax = "proto3";

package nwfl.mensa.v1;

import "google/protobuf/timestamp.proto";
import "nwfl/mensa/v1/common.proto";

// Where in the group's territory something happens.
enum Area {
  AREA_UNSPECIFIED = 0;
  AREA_OKALOOSA = 1;
  AREA_WALTON = 2;
  AREA_BAY = 3;
  AREA_ESCAMBIA_SANTA_ROSA = 4;
  AREA_VIRTUAL = 5;
  // Regional and national events outside the ten counties.
  AREA_ELSEWHERE = 6;
}

enum VenueKind {
  VENUE_KIND_UNSPECIFIED = 0;
  VENUE_KIND_BUSINESS = 1;
  // Shown only as the area and the host office's role alias. Its street
  // address is never stored (R3).
  VENUE_KIND_MEMBER_HOME = 2;
  VENUE_KIND_VIRTUAL = 3;
}

message Venue {
  string id = 1;
  VenueKind kind = 2;
  // The business name; for a member's home, a label such as "A member's home".
  string name = 3;
  // Businesses only. Always empty for a member's home or a virtual venue.
  string business_address = 4;
  string city = 5;
  Area area = 6;
  // The office whose role alias is the contact. Required for a member's home.
  string host_office_id = 7;
  // A business website or map link; for a virtual venue, the meeting page.
  string url = 8;
  string accessibility_note = 9;
  bool active = 10;
}

enum EventCategory {
  EVENT_CATEGORY_UNSPECIFIED = 0;
  EVENT_CATEGORY_LUNCH = 1;
  EVENT_CATEGORY_DINNER = 2;
  EVENT_CATEGORY_HAPPY_HOUR = 3;
  EVENT_CATEGORY_EXCOMM = 4;
  EVENT_CATEGORY_PICNIC = 5;
  EVENT_CATEGORY_PARTY = 6;
  EVENT_CATEGORY_REGIONAL = 7;
  EVENT_CATEGORY_NATIONAL = 8;
  EVENT_CATEGORY_VIRTUAL = 9;
  EVENT_CATEGORY_OTHER = 10;
}

enum EventVisibility {
  EVENT_VISIBILITY_UNSPECIFIED = 0;
  EVENT_VISIBILITY_PUBLIC = 1;
  // Read without a member token, only the date, the area and "Members event,
  // sign in for details" are returned.
  EVENT_VISIBILITY_MEMBERS = 2;
}

enum OccurrenceStatus {
  OCCURRENCE_STATUS_UNSPECIFIED = 0;
  OCCURRENCE_STATUS_SCHEDULED = 1;
  OCCURRENCE_STATUS_TENTATIVE = 2;
  OCCURRENCE_STATUS_CANCELLED = 3;
  OCCURRENCE_STATUS_MOVED = 4;
}

message EventSeries {
  string id = 1;
  string slug = 2;
  string title = 3;
  EventCategory category = 4;
  // An RFC 5545 RRULE, such as FREQ=MONTHLY;BYDAY=2FR.
  string recurrence = 5;
  // "Second Friday".
  string cadence_label = 6;
  TimeOfDay default_start = 7;
  int32 default_duration_minutes = 8;
  // Empty when the venue rotates.
  string default_venue_id = 9;
  Area area = 10;
  string host_office_id = 11;
  string description = 12;
  EventVisibility visibility = 13;
  bool active = 14;
  // The first date: the anchor the recurrence counts from (DTSTART).
  Date starts_on = 15;
}

message EventOccurrence {
  string id = 1;
  // Empty for a one-off event.
  string series_id = 2;
  string title = 3;
  google.protobuf.Timestamp starts_at = 4;
  google.protobuf.Timestamp ends_at = 5;
  // Empty while the venue is to be decided.
  string venue_id = 6;
  // The venue, resolved on reads.
  Venue venue = 7;
  OccurrenceStatus status = 8;
  // "Happy Thanksgiving", "Moved to the 14th".
  string status_note = 9;
  // "We'll sit outside".
  string detail = 10;
  string url = 11;
  EventVisibility visibility = 12;
  // Set on a members event read without a member token: every detail beyond
  // the date and the area has been left out.
  bool details_withheld = 13;
  // The local (Central) date. Always set, including when details are withheld
  // or the time is not known yet.
  Date local_date = 14;
  // From the venue, or the series when the venue is not decided.
  Area area = 15;
}

// The calendar. Reads return what the caller's token may see.
service EventService {
  rpc ListOccurrences(ListOccurrencesRequest) returns (ListOccurrencesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc GetOccurrence(GetOccurrenceRequest) returns (GetOccurrenceResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListSeries(ListSeriesRequest) returns (ListSeriesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListVenues(ListVenuesRequest) returns (ListVenuesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Officer writes, live on save.
  rpc SaveSeries(SaveSeriesRequest) returns (SaveSeriesResponse);
  rpc SaveOccurrence(SaveOccurrenceRequest) returns (SaveOccurrenceResponse);
  rpc SaveVenue(SaveVenueRequest) returns (SaveVenueResponse);
}

message ListOccurrencesRequest {
  Date from = 1;
  Date to = 2;
  // Empty means every area.
  repeated Area areas = 3;
  bool include_cancelled = 4;
}

message ListOccurrencesResponse {
  repeated EventOccurrence occurrences = 1;
}

message GetOccurrenceRequest {
  string id = 1;
}

message GetOccurrenceResponse {
  EventOccurrence occurrence = 1;
}

message ListSeriesRequest {
  bool include_inactive = 1;
}

message ListSeriesResponse {
  repeated EventSeries series = 1;
}

message ListVenuesRequest {
  bool include_inactive = 1;
}

message ListVenuesResponse {
  repeated Venue venues = 1;
}

message SaveSeriesRequest {
  // An empty id creates.
  EventSeries series = 1;
}

message SaveSeriesResponse {
  EventSeries series = 1;
}

message SaveOccurrenceRequest {
  // An empty id creates.
  EventOccurrence occurrence = 1;
}

message SaveOccurrenceResponse {
  EventOccurrence occurrence = 1;
}

message SaveVenueRequest {
  // An empty id creates.
  Venue venue = 1;
}

message SaveVenueResponse {
  Venue venue = 1;
}
