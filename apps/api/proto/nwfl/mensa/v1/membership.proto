// Member accounts and the sign-up queue (R24, R33). Only what the member typed
// is stored, plus the account's status; never anything National-sourced. The
// approval screens have no free-text notes. PROFILE-ID: what the member typed
// (first name, last name, membership number) is kept on the sign-up, shown to
// the approvers and the Admin, and once approved is the member's profile: the
// names editable, the number never.
syntax = "proto3";

package nwfl.mensa.v1;

import "google/protobuf/timestamp.proto";
import "nwfl/mensa/v1/common.proto";

enum MemberStatus {
  MEMBER_STATUS_UNSPECIFIED = 0;
  MEMBER_STATUS_PENDING = 1;
  MEMBER_STATUS_MEMBER = 2;
  // Member-level reading for an affiliated officer, such as the RVC. Set only
  // by an Admin or Webmaster grant, never by a verification.
  MEMBER_STATUS_AFFILIATE = 3;
  MEMBER_STATUS_LAPSED = 4;
  MEMBER_STATUS_REMOVED = 5;
}

enum AccountRoute {
  ACCOUNT_ROUTE_UNSPECIFIED = 0;
  ACCOUNT_ROUTE_INVITE = 1;
  ACCOUNT_ROUTE_SIGNUP = 2;
  ACCOUNT_ROUTE_ADMIN_GRANT = 3;
}

// The verifier's result for a sign-up, as the approver sees it.
enum Verification {
  VERIFICATION_UNSPECIFIED = 0;
  VERIFICATION_UNCHECKED = 1;
  VERIFICATION_VERIFIED_LOCAL = 2;
  // An active member of another local group. Goes to officer review; it never
  // grants member access by itself.
  VERIFICATION_VERIFIED_OTHER_GROUP = 3;
  // Never rejects by itself: opted-out and lapsed members may not appear.
  VERIFICATION_NOT_FOUND = 4;
  VERIFICATION_ERROR = 5;
  // VET: the number and the last name match a local member, the email does
  // not. Never approves by itself: confirm with the member first.
  VERIFICATION_EMAIL_MISMATCH = 6;
  // VET: another sign-up already claimed this number. Never approves by
  // itself: an officer resolves it first.
  VERIFICATION_DUPLICATE_CLAIM = 7;
}

// OFFICER-VERIFY: what the membership check's local group says about a person,
// decided when read against CHAPTER_GROUP_NAME; always unspecified while
// OFFICER_VERIFY is off.
enum LocalGroupStanding {
  // No local group was reported.
  LOCAL_GROUP_STANDING_UNSPECIFIED = 0;
  // The chapter's own group (CHAPTER_GROUP_NAME): a chapter member.
  LOCAL_GROUP_STANDING_CHAPTER = 1;
  // Another local group, or none: a guest member.
  LOCAL_GROUP_STANDING_GUEST = 2;
  // A name not among the known local groups: a guest member, flagged for the
  // approvers.
  LOCAL_GROUP_STANDING_GUEST_UNLISTED = 3;
}

// OFFICER-VERIFY: the officer tools for the caller, from their groups and
// standing (auth/caller.ts).
enum OfficerTools {
  // The caller holds no officer power.
  OFFICER_TOOLS_UNSPECIFIED = 0;
  // The caller's powers are in force.
  OFFICER_TOOLS_OPEN = 1;
  // The caller holds a power that waits for their membership check.
  OFFICER_TOOLS_AWAITING_CHECK = 2;
}

// OFFICER-VERIFY: what an approved member or affiliate whose officer tools
// wait can do about it. An officer power needs a check that confirmed the
// number, the last name and the first name, and either the chapter's own
// local group or an Admin's affiliate grant. Unspecified whenever the tools do
// not wait, and for a caller with no approved account (they sign up, or wait
// for their first check).
enum OfficerCheck {
  OFFICER_CHECK_UNSPECIFIED = 0;
  // The check has not confirmed all of it: SubmitSignup with the names again
  // asks for a fresh check.
  OFFICER_CHECK_CONFIRM_DETAILS = 1;
  // A fresh check is asked for and has not answered yet.
  OFFICER_CHECK_RUNNING = 2;
  // The last fresh check did not confirm the details; they may ask again.
  OFFICER_CHECK_NOT_CONFIRMED = 3;
  // Confirmed as a member of another local group (a guest member): the tools
  // open when the Admin grants affiliate standing.
  OFFICER_CHECK_NEEDS_GRANT = 4;
  // The fresh check matched the number and the names but not the email: an
  // approver confirms it with the member, as for a first sign-up.
  OFFICER_CHECK_AWAITING_APPROVER = 5;
}

// GetSignupRequest: where one sign-up stands.
enum SignupDecision {
  SIGNUP_DECISION_UNSPECIFIED = 0;
  SIGNUP_DECISION_PENDING = 1;
  SIGNUP_DECISION_APPROVED = 2;
  SIGNUP_DECISION_REJECTED = 3;
  // Rejected, then reopened (REOPEN).
  SIGNUP_DECISION_REOPENED = 4;
}

message MemberAccount {
  MemberStatus status = 1;
  AccountRoute route = 2;
  // The last time the account's membership was confirmed.
  Date verified_on = 3;
  // OFFICER-VERIFY: a chapter member or a guest member, by the reported local
  // group; unspecified when none was reported.
  LocalGroupStanding local_group_standing = 4;
}

// A pending sign-up as the approver sees it: what the person typed, and
// whether and when the number was verified, with what outcome.
message SignupRequest {
  string request_id = 1;
  string display_name = 2;
  // As the member typed it.
  string email = 3;
  Verification verification = 4;
  Date verified_on = 5;
  google.protobuf.Timestamp created_at = 6;
  // How the account came to be: a sign-up, or an invitation that then signed up.
  AccountRoute route = 7;
  // VET: for a duplicate claim, the earlier sign-up the verifier named, if any.
  EarlierClaim earlier_claim = 8;
  // PROFILE-ID: as the person typed them at sign-up. The first name is empty
  // for a sign-up sent before it was asked for.
  string first_name = 9;
  string last_name = 10;
  // Digits only.
  string membership_number = 11;
  // OFFICER-VERIFY: whether the check confirmed the typed first name; unset
  // when it did not say.
  optional bool first_name_matched = 12;
  // OFFICER-VERIFY: the local group the check reported, and what it makes the
  // person; empty and unspecified when none was reported.
  string local_group = 13;
  LocalGroupStanding local_group_standing = 14;
  // OFFICER-VERIFY: whether an approver may approve this sign-up by hand, and
  // why not; ApproveSignup holds to the same answer. Unspecified while
  // OFFICER_VERIFY is off, when the rule is as before: an other-group match is
  // not approved as a member.
  HandApproval hand_approval = 15;
  // OFFICER-VERIFY: not a sign-up waiting for its first decision, but an
  // approved member's fresh check that found an email mismatch. It never opens
  // officer tools by itself: ApproveSignup with confirmed_warning confirms the
  // check, RejectSignup declines it, and neither changes the account.
  bool fresh_check = 16;
}

// OFFICER-VERIFY (switched on): what an approver may do with a sign-up by hand.
enum HandApproval {
  // OFFICER_VERIFY off: the rule as before.
  HAND_APPROVAL_UNSPECIFIED = 0;
  // May be approved, a chapter member or (a plain sign-up) on the approver's word.
  HAND_APPROVAL_OPEN = 1;
  // May be approved, as a guest member: another local group, or none.
  HAND_APPROVAL_AS_GUEST = 2;
  // An invited sign-up the check has not confirmed: reject it, or reopen it.
  HAND_APPROVAL_NEEDS_CHECK = 3;
}

// VET: the earlier sign-up that claimed the same number, as the site already
// holds it: its display name, when it signed up and (PROFILE-ID) what it typed.
message EarlierClaim {
  // Empty when the earlier sign-up is closed (see closed).
  string display_name = 1;
  google.protobuf.Timestamp signed_up_at = 2;
  // VET fix 1: the earlier sign-up was rejected (or rejected and reopened)
  // since. Its name is then not sent: only the Admin and the Membership
  // Officer see a rejected sign-up's name (ListRejectedSignups). The
  // approver sees "an earlier claim (since closed)" and its date.
  bool closed = 3;
  // PROFILE-ID: as the earlier sign-up typed them (its profile, if approved
  // and changed since). Empty when closed, as the display name is.
  string first_name = 4;
  string last_name = 5;
  string membership_number = 6;
}

// A rejected sign-up that can still be reopened, as the Admin or the Membership Officer sees it,
// with what the person typed (PROFILE-ID).
message RejectedSignup {
  string request_id = 1;
  string display_name = 2;
  // As the member typed it.
  string email = 3;
  Verification verification = 4;
  Date verified_on = 5;
  google.protobuf.Timestamp rejected_at = 6;
  // PROFILE-ID: as the person typed them at sign-up.
  string first_name = 7;
  string last_name = 8;
  string membership_number = 9;
}

// PROFILE-ID: an approved member's own profile, read by its owner alone. The
// names are as typed at sign-up until the member changes them; the number is
// shown, never changed.
message MemberProfile {
  string first_name = 1;
  string last_name = 2;
  string membership_number = 3;
  // OFFICER-VERIFY: the local group the membership check reported; empty when
  // none was. Not changed by the member.
  string local_group = 4;
}

// An account as the approvers see it, for removal and the yearly re-check.
message Member {
  // The Authentik subject.
  string subject = 1;
  // As the member typed it at sign-up; empty for an account that never signed up.
  string display_name = 2;
  string email = 3;
  MemberStatus status = 4;
  AccountRoute route = 5;
  Date verified_on = 6;
  // Verified more than 12 months ago: due for the yearly re-check. After 13
  // months the account reads at public level until it is verified again.
  bool recheck_due = 7;
}

// Accounts and approvals. The subject, display name and email come from the
// verified token, never from a request field.
service MembershipService {
  // Called by a signed-in pending user. The number and the last name are
  // both required, invited or not; the membership verification service
  // confirms them, and an approver decides. A token with the invited group opens the account with
  // the invite route.
  //
  // OFFICER-VERIFY (switched on): an approved member or affiliate whose officer
  // tools wait (GetMyAccount officer_check CONFIRM_DETAILS or NOT_CONFIRMED)
  // calls this again to ask for a fresh membership check. The first and last
  // name as sent replace the profile's; the membership number never changes
  // (sent, it must be the one on file, else INVALID_ARGUMENT). The account
  // keeps its standing meanwhile, and the answer carries the same request_id.
  // While a fresh check runs, and for everyone else with a sign-up on file:
  // ALREADY_EXISTS, as before.
  rpc SubmitSignup(SubmitSignupRequest) returns (SubmitSignupResponse);
  rpc GetMyAccount(GetMyAccountRequest) returns (GetMyAccountResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // PROFILE-ID: an approved member changes their own first and last name. The
  // membership number has no field here and no other way in: a request that
  // carries any other field is INVALID_ARGUMENT, and nothing changes. Anyone
  // without an approved sign-up: FAILED_PRECONDITION.
  rpc UpdateMyProfile(UpdateMyProfileRequest) returns (UpdateMyProfileResponse);
  // Approvers only.
  rpc ListSignupRequests(ListSignupRequestsRequest) returns (ListSignupRequestsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Approvers only (and the Admin): where one sign-up stands, by its id. No
  // such sign-up: NOT_FOUND.
  rpc GetSignupRequest(GetSignupRequestRequest) returns (GetSignupRequestResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Approves or rejects a pending sign-up; what it typed is kept (PROFILE-ID).
  // No approver decides their own sign-up. OFFICER-VERIFY: a sign-up the
  // verifier found in another local group is approved as a guest member (or
  // rejected, or granted affiliate standing). An invited sign-up is approved
  // only once the verifier confirmed its number and last name (a local or
  // other-group match, or an email mismatch) and did not report a first-name
  // mismatch; anything else is FAILED_PRECONDITION: reject or reopen it. VET
  // fix 1: an email mismatch or a duplicate claim is approved only with
  // confirmed_warning set; without it, FAILED_PRECONDITION, and nothing
  // changes.
  rpc ApproveSignup(ApproveSignupRequest) returns (ApproveSignupResponse);
  rpc RejectSignup(RejectSignupRequest) returns (RejectSignupResponse);
  // Accounts with member-level standing or past it: for removal and the yearly re-check.
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse);
  // The yearly re-check, confirmed by an officer: an approver confirms a
  // member, which dates its verification today (a lapsed account becomes a
  // member again). No one confirms themselves.
  rpc ConfirmMember(ConfirmMemberRequest) returns (ConfirmMemberResponse);
  // Admin or Webmaster only. Member-level reading for an invited affiliate,
  // with the verifier's other-group result as its verification when there is
  // one, and the grantor's attestation otherwise. OFFICER-VERIFY (switched
  // on): also for an approved guest member, one the membership check confirmed
  // as a member of another local group; any other approved member is
  // FAILED_PRECONDITION, as before. An affiliate's officer tools open only once
  // the check confirmed their number, last name and first name. Switched on,
  // the Admin only, and a pending sign-up only as a guest or unconfirmed.
  rpc GrantAffiliate(GrantAffiliateRequest) returns (GrantAffiliateResponse);
  // REOPEN: the Admin or the Membership Officer only (nwfl-admin, nwfl-office-membership). The
  // rejected sign-ups that can be reopened (the account the rejection closed is still closed),
  // newest first, never the caller's own.
  rpc ListRejectedSignups(ListRejectedSignupsRequest) returns (ListRejectedSignupsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // REOPEN: the Admin or the Membership Officer only, never on their own sign-up. Returns the
  // person to where they can sign up again: the account the rejection closed is gone, and the
  // rejected sign-up stays, marked reopened by whom and when, with what it typed. A sign-up
  // that is not rejected, already reopened, or whose account is no longer closed is refused.
  rpc ReopenSignup(ReopenSignupRequest) returns (ReopenSignupResponse);
}

message SubmitSignupRequest {
  // Matched with the number by the verifier.
  string last_name = 1;
  // Typed by the member from their card or renewal email. Kept on the sign-up
  // and the member's profile, never changed (PROFILE-ID).
  string membership_number = 2;
  // PROFILE-ID: for the approvers and the profile, and (OFFICER-VERIFY) for
  // the verifier to confirm. Optional on a plain sign-up; REQUIRED on the
  // invite route (an invited person, or one holding an officer power).
  string first_name = 3;
}

message SubmitSignupResponse {
  string request_id = 1;
}

message GetMyAccountRequest {}

message GetMyAccountResponse {
  MemberAccount account = 1;
  // PROFILE-ID: set for an approved member (member, affiliate or lapsed)
  // whose sign-up holds it.
  MemberProfile profile = 2;
  // OFFICER-VERIFY: whether the caller's officer tools are open, waiting for
  // the membership check, or not theirs at all.
  OfficerTools officer_tools = 3;
  // OFFICER-VERIFY: for an approved account whose officer tools wait, what
  // opens them.
  OfficerCheck officer_check = 4;
}

message GetSignupRequestRequest {
  string request_id = 1;
}

message GetSignupRequestResponse {
  SignupDecision decision = 1;
}

message UpdateMyProfileRequest {
  string first_name = 1;
  string last_name = 2;
}

message UpdateMyProfileResponse {}

message ListSignupRequestsRequest {}

message ListSignupRequestsResponse {
  repeated SignupRequest requests = 1;
}

message ApproveSignupRequest {
  string request_id = 1;
  // VET fix 1: the approver confirmed with the member (an email mismatch) or
  // resolved the earlier claim (a duplicate claim). Needed to approve either;
  // the audit records it. Ignored for every other outcome.
  bool confirmed_warning = 2;
}

message ApproveSignupResponse {
  MemberAccount account = 1;
}

message RejectSignupRequest {
  string request_id = 1;
}

message RejectSignupResponse {}

message ListMembersRequest {
  // Only the accounts due for the yearly re-check.
  bool recheck_due_only = 1;
}

message ListMembersResponse {
  repeated Member members = 1;
}

message RemoveMemberRequest {
  // The Authentik subject of the account.
  string subject = 1;
}

message RemoveMemberResponse {}

message ConfirmMemberRequest {
  // The Authentik subject of the account.
  string subject = 1;
}

message ConfirmMemberResponse {
  MemberAccount account = 1;
}

message GrantAffiliateRequest {
  // The Authentik subject of the account.
  string subject = 1;
}

message GrantAffiliateResponse {
  MemberAccount account = 1;
}

message ListRejectedSignupsRequest {}

message ListRejectedSignupsResponse {
  repeated RejectedSignup requests = 1;
}

message ReopenSignupRequest {
  string request_id = 1;
}

message ReopenSignupResponse {}
