// Member accounts and the sign-up queue (R24, R33). Only what the member typed
// is stored, plus the account's status; never anything National-sourced. The
// approval screens have no free-text notes.
syntax = "proto3";

package nwfl.mensa.v1;

import "google/protobuf/timestamp.proto";
import "nwfl/mensa/v1/common.proto";

enum MemberStatus {
  MEMBER_STATUS_UNSPECIFIED = 0;
  MEMBER_STATUS_PENDING = 1;
  MEMBER_STATUS_MEMBER = 2;
  // Member-level reading for an affiliated officer, such as the RVC. Set only
  // by an Admin or Webmaster grant, never by a verification.
  MEMBER_STATUS_AFFILIATE = 3;
  MEMBER_STATUS_LAPSED = 4;
  MEMBER_STATUS_REMOVED = 5;
}

enum AccountRoute {
  ACCOUNT_ROUTE_UNSPECIFIED = 0;
  ACCOUNT_ROUTE_INVITE = 1;
  ACCOUNT_ROUTE_SIGNUP = 2;
  ACCOUNT_ROUTE_ADMIN_GRANT = 3;
}

// The verifier's result for a sign-up, as the approver sees it.
enum Verification {
  VERIFICATION_UNSPECIFIED = 0;
  VERIFICATION_UNCHECKED = 1;
  VERIFICATION_VERIFIED_LOCAL = 2;
  // An active member of another local group. Goes to officer review; it never
  // grants member access by itself.
  VERIFICATION_VERIFIED_OTHER_GROUP = 3;
  // Never rejects by itself: opted-out and lapsed members may not appear.
  VERIFICATION_NOT_FOUND = 4;
  VERIFICATION_ERROR = 5;
  // VET: the number and the last name match a local member, the email does
  // not. Never approves by itself: confirm with the member first.
  VERIFICATION_EMAIL_MISMATCH = 6;
  // VET: another sign-up already claimed this number. Never approves by
  // itself: an officer resolves it first.
  VERIFICATION_DUPLICATE_CLAIM = 7;
}

message MemberAccount {
  MemberStatus status = 1;
  AccountRoute route = 2;
  // The last time the account's membership was confirmed.
  Date verified_on = 3;
}

// A pending sign-up as the approver sees it. The membership number and the
// last name are never shown: only whether and when the number was verified,
// and with what outcome.
message SignupRequest {
  string request_id = 1;
  string display_name = 2;
  // As the member typed it.
  string email = 3;
  Verification verification = 4;
  Date verified_on = 5;
  google.protobuf.Timestamp created_at = 6;
  // How the account came to be: a sign-up, or an invitation that then signed up.
  AccountRoute route = 7;
  // VET: for a duplicate claim, the earlier sign-up the verifier named, if any.
  EarlierClaim earlier_claim = 8;
}

// VET: the earlier sign-up that claimed the same number, as the site already
// holds it: its display name and when it signed up. Never a number.
message EarlierClaim {
  // Empty when the earlier sign-up is closed (see closed).
  string display_name = 1;
  google.protobuf.Timestamp signed_up_at = 2;
  // VET fix 1: the earlier sign-up was rejected (or rejected and reopened)
  // since. Its name is then not sent: only the Admin and the Membership
  // Officer see a rejected sign-up's name (ListRejectedSignups). The
  // approver sees "an earlier claim (since closed)" and its date.
  bool closed = 3;
}

// A rejected sign-up that can still be reopened, as the Admin or the Membership Officer sees it:
// never the number or the last name, which the rejection erased.
message RejectedSignup {
  string request_id = 1;
  string display_name = 2;
  // As the member typed it.
  string email = 3;
  Verification verification = 4;
  Date verified_on = 5;
  google.protobuf.Timestamp rejected_at = 6;
}

// An account as the approvers see it, for removal and the yearly re-check.
message Member {
  // The Authentik subject.
  string subject = 1;
  // As the member typed it at sign-up; empty for an account that never signed up.
  string display_name = 2;
  string email = 3;
  MemberStatus status = 4;
  AccountRoute route = 5;
  Date verified_on = 6;
  // Verified more than 12 months ago: due for the yearly re-check. After 13
  // months the account reads at public level until it is verified again.
  bool recheck_due = 7;
}

// Accounts and approvals. The subject, display name and email come from the
// verified token, never from a request field.
service MembershipService {
  // Called by a signed-in pending user. The number and the last name are
  // both required, invited or not; the membership verification service
  // confirms them, and an approver decides. A token with the invited group opens the account with
  // the invite route.
  rpc SubmitSignup(SubmitSignupRequest) returns (SubmitSignupResponse);
  rpc GetMyAccount(GetMyAccountRequest) returns (GetMyAccountResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Approvers only.
  rpc ListSignupRequests(ListSignupRequestsRequest) returns (ListSignupRequestsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Approves or rejects a pending sign-up, erasing its number and last name.
  // No approver decides their own sign-up. A sign-up the verifier found in
  // another local group is not approved as a member: it is rejected, or the
  // account is granted affiliate standing. VET fix 1: an email mismatch or a
  // duplicate claim is approved only with confirmed_warning set; without it,
  // FAILED_PRECONDITION, and nothing changes.
  rpc ApproveSignup(ApproveSignupRequest) returns (ApproveSignupResponse);
  rpc RejectSignup(RejectSignupRequest) returns (RejectSignupResponse);
  // Accounts with member-level standing or past it: for removal and the yearly re-check.
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse);
  // The yearly re-check, confirmed by an officer: an approver confirms a
  // member, which dates its verification today (a lapsed account becomes a
  // member again). No one confirms themselves.
  rpc ConfirmMember(ConfirmMemberRequest) returns (ConfirmMemberResponse);
  // Admin or Webmaster only. Member-level reading for an invited affiliate,
  // with the verifier's other-group result as its verification when there is
  // one, and the grantor's attestation otherwise.
  rpc GrantAffiliate(GrantAffiliateRequest) returns (GrantAffiliateResponse);
  // REOPEN: the Admin or the Membership Officer only (nwfl-admin, nwfl-office-membership). The
  // rejected sign-ups that can be reopened (the account the rejection closed is still closed),
  // newest first, never the caller's own.
  rpc ListRejectedSignups(ListRejectedSignupsRequest) returns (ListRejectedSignupsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // REOPEN: the Admin or the Membership Officer only, never on their own sign-up. Returns the
  // person to where they can sign up again: the account the rejection closed is gone, and the
  // rejected sign-up stays, marked reopened by whom and when. Nothing erased comes back. A sign-up
  // that is not rejected, already reopened, or whose account is no longer closed is refused.
  rpc ReopenSignup(ReopenSignupRequest) returns (ReopenSignupResponse);
}

message SubmitSignupRequest {
  // Matched with the number by the verifier.
  string last_name = 1;
  // Typed by the member from their card or renewal email. Erased as soon as
  // the verifier reports.
  string membership_number = 2;
}

message SubmitSignupResponse {
  string request_id = 1;
}

message GetMyAccountRequest {}

message GetMyAccountResponse {
  MemberAccount account = 1;
}

message ListSignupRequestsRequest {}

message ListSignupRequestsResponse {
  repeated SignupRequest requests = 1;
}

message ApproveSignupRequest {
  string request_id = 1;
  // VET fix 1: the approver confirmed with the member (an email mismatch) or
  // resolved the earlier claim (a duplicate claim). Needed to approve either;
  // the audit records it. Ignored for every other outcome.
  bool confirmed_warning = 2;
}

message ApproveSignupResponse {
  MemberAccount account = 1;
}

message RejectSignupRequest {
  string request_id = 1;
}

message RejectSignupResponse {}

message ListMembersRequest {
  // Only the accounts due for the yearly re-check.
  bool recheck_due_only = 1;
}

message ListMembersResponse {
  repeated Member members = 1;
}

message RemoveMemberRequest {
  // The Authentik subject of the account.
  string subject = 1;
}

message RemoveMemberResponse {}

message ConfirmMemberRequest {
  // The Authentik subject of the account.
  string subject = 1;
}

message ConfirmMemberResponse {
  MemberAccount account = 1;
}

message GrantAffiliateRequest {
  // The Authentik subject of the account.
  string subject = 1;
}

message GrantAffiliateResponse {
  MemberAccount account = 1;
}

message ListRejectedSignupsRequest {}

message ListRejectedSignupsResponse {
  repeated RejectedSignup requests = 1;
}

message ReopenSignupRequest {
  string request_id = 1;
}

message ReopenSignupResponse {}
